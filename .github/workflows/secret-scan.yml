# Re-runs the same pre-push guard in CI, so a push made without the local hook
# (or with --no-verify) still gets scanned before it can merge.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so every commit in the range can be scanned

      - name: Scan the commits in this PR / push
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$PUSH_BEFORE"; head="$PUSH_AFTER"; fi
          # The very first push to main has no "before" commit: scan all history instead.
          if [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            export GUARD_SCAN_ALL=1
          fi
          echo "refs/heads/ci $head refs/heads/ci $base" | bash .githooks/pre-push
